<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Neon Runner 3D</title>
    <meta name="theme-color" content="#070914" />
  </head>
  <body>
    <main class="game">
      <canvas id="canvas" aria-label="Jogo de corrida 3D"></canvas>
      <div class="hud" aria-live="polite">
        <span>Pontos <b id="score">0</b></span>
        <span>Peças <b id="coins">0</b></span>
        <span>Recorde <b id="best">0</b></span>
      </div>
      <div class="overlay" id="overlay">
        <h1>Neon Runner</h1>
        <p id="result" hidden></p>
        <button id="play" type="button">Jogar</button>
        <p class="keys">Setas ou A/D para mover · Espaço ou ↑ para pular<br />No celular, deslize na tela</p>
      </div>
      <div class="pad">
        <button type="button" id="bl" aria-label="Esquerda">◀</button>
        <button type="button" id="bj" aria-label="Pular">▲</button>
        <button type="button" id="br" aria-label="Direita">▶</button>
      </div>
      <p class="unsupported" id="unsupported" hidden>Seu navegador não suporta WebGL, necessário para o jogo.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
